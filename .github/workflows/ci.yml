name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core correctness and stress tests
    runs-on: xcode-27
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run core tests
        run: bash macos/Tests/run-tests.sh

  app-build:
    name: Build macOS app
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build release app without signing
        run: >-
          xcodebuild
          -project macos/GrapeCompare.xcodeproj
          -scheme GrapeCompare
          -destination 'platform=macOS'
          -configuration Release
          -derivedDataPath "$RUNNER_TEMP/GrapeCompareDerivedData"
          MACOSX_DEPLOYMENT_TARGET=14.0
          CODE_SIGNING_ALLOWED=NO
          build

  performance-budget:
    name: Large-input performance budgets
    runs-on: xcode-27
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify time and memory budgets
        env:
          GRAPECOMPARE_VERIFY_PERFORMANCE: '1'
        run: |
          bash macos/Benchmarks/run-benchmarks.sh 100000 10000
          bash macos/Benchmarks/run-git-benchmarks.sh 5000 100
