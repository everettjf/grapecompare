name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core correctness and stress tests
    runs-on: xcode-27
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run core tests
        run: bash macos/Tests/run-tests.sh

      - name: Run CLI and real Git integration tests
        run: bash macos/CLI/run-tests.sh

      - name: Validate localization coverage
        run: ruby macos/Tests/validate-localizations.rb

  release-artifact:
    name: Universal release artifact audit
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build direct-distribution candidate
        run: bash scripts/build-release.sh 1.15.0 "$RUNNER_TEMP/release"

      - name: Validate archive, architectures, deployment target, signature, sandbox, and localizations
        run: bash scripts/validate-release.sh 1.15.0 "$RUNNER_TEMP/release"

  performance-budget:
    name: Large-input performance budgets
    runs-on: xcode-27
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify time and memory budgets
        env:
          GRAPECOMPARE_VERIFY_PERFORMANCE: '1'
        run: |
          bash macos/Benchmarks/run-benchmarks.sh 100000 10000
          bash macos/Benchmarks/run-git-benchmarks.sh 10000 200
