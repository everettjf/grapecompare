name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core correctness and stress tests
    runs-on: xcode-27
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run correctness audit
        run: ruby scripts/run-correctness-audit.rb "$RUNNER_TEMP/correctness-report.json"

      - name: Upload correctness and screenshot audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correctness-audit
          path: ${{ runner.temp }}/correctness-report.json

  release-artifact:
    name: Universal release artifact audit
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build direct-distribution candidate
        run: bash scripts/build-release.sh 1.15.0 "$RUNNER_TEMP/release"

      - name: Validate archive, architectures, deployment target, signature, sandbox, and localizations
        run: bash scripts/validate-release.sh 1.15.0 "$RUNNER_TEMP/release"

  performance-budget:
    name: Large-input performance budgets
    runs-on: xcode-27
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify time and memory budgets
        env:
          GRAPECOMPARE_VERIFY_PERFORMANCE: '1'
        run: |
          bash macos/Benchmarks/run-benchmarks.sh 100000 10000
          bash macos/Benchmarks/run-git-benchmarks.sh 10000 200
